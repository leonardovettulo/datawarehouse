[project]
name = "dagsteross"
version = "0.1.0"
description = "On-prem DW: Dagster orchestration against ClickHouse, Metabase serving"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9,<2",
    "dagster-webserver>=1.9,<2",
    "dagster-postgres>=0.25,<0.26",
    "clickhouse-connect>=0.8",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*"]

[tool.pytest.ini_options]
filterwarnings = [
    # Dagster 1.9 internals on pydantic 2.11; not ours.
    "ignore::DeprecationWarning:dagster._model.pydantic_compat_layer",
]
