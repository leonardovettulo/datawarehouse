[project]
name = "dagsteross"
version = "0.1.0"
description = "Simple single-box Dagster OSS deployment"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9,<2",
    "dagster-webserver>=1.9,<2",
    "dagster-postgres>=0.25,<0.26",
    "dagster-dbt>=0.25,<0.26",
    "dlt[postgres]>=1.0",
    "clickhouse-connect>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_pipelines*"]
