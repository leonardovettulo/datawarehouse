name: dw-local

services:
  postgres:
    build: ./platform/postgres
    image: dw-postgres:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      PG_METABASE_PASSWORD: ${PG_METABASE_PASSWORD:?}
      PG_DAGSTER_PASSWORD: ${PG_DAGSTER_PASSWORD:?}
      PG_SOURCE_PASSWORD: ${PG_SOURCE_PASSWORD:?}
      ENABLE_LOCAL_SOURCE: "1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [dw_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse:
    build: ./platform/clickhouse
    image: dw-clickhouse:local
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CH_DAGSTER_PASSWORD: ${CH_DAGSTER_PASSWORD:?}
      CH_METABASE_PASSWORD: ${CH_METABASE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - clickhouse_backups:/backups
    ports:
      - "127.0.0.1:8123:8123"
    networks: [dw_net]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  metabase:
    image: metabase/metabase:v0.63.16.4@sha256:1fa6f6b523a44159c26f6eb0704ed6189a8c7863fdab9e0c2483f388728c7ce3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${PG_METABASE_PASSWORD:?}
      MB_SITE_URL: ${MB_SITE_URL:-http://localhost:3000}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?}
      JAVA_TIMEZONE: UTC
      JAVA_TOOL_OPTIONS: -Xmx768m
    volumes:
      - metabase_data:/metabase-data
    networks: [dw_net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

networks:
  dw_net:
    name: dw_net

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  clickhouse_backups:
  metabase_data:
