# Production platform stack (Ubuntu box). Not used by `make up`.
#
#   sudo ./platform/prepare-host.sh
#   docker compose --project-directory platform -f platform/compose.prod.yaml --env-file .env up -d
#
# Do not publish 8123/9000 to 0.0.0.0. Metabase is loopback-only; nginx on the host
# terminates TLS. Native protocol (9000) stays on dw_net for clickhouse-client
# via `docker exec`. Optional Linux caps (SYS_NICE, IPC_LOCK) are omitted.

name: dw-platform

services:
  postgres:
    build: ./postgres
    image: dw-postgres:prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      PG_METABASE_PASSWORD: ${PG_METABASE_PASSWORD:?}
      PG_DAGSTER_PASSWORD: ${PG_DAGSTER_PASSWORD:?}
    volumes:
      - /srv/dw/postgres:/var/lib/postgresql/data
    networks: [dw_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse:
    build: ./clickhouse
    image: dw-clickhouse:prod
    restart: unless-stopped
    mem_limit: ${CH_MEM_LIMIT:-8g}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CH_DAGSTER_PASSWORD: ${CH_DAGSTER_PASSWORD:?}
      CH_METABASE_PASSWORD: ${CH_METABASE_PASSWORD:?}
    volumes:
      - /srv/dw/clickhouse:/var/lib/clickhouse
      - /srv/dw/clickhouse-logs:/var/log/clickhouse-server
      - /srv/dw/backups/clickhouse:/backups
    networks: [dw_net]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  metabase:
    image: metabase/metabase:v0.63.16.4@sha256:1fa6f6b523a44159c26f6eb0704ed6189a8c7863fdab9e0c2483f388728c7ce3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${PG_METABASE_PASSWORD:?}
      MB_SITE_URL: ${MB_SITE_URL:?}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?}
      JAVA_TIMEZONE: UTC
      JAVA_TOOL_OPTIONS: -Xmx768m
    volumes:
      - /srv/dw/metabase:/metabase-data
    networks: [dw_net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

networks:
  dw_net:
    name: dw_net
