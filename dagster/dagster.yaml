# Postgres-backed instance. Env vars are injected by docker-compose.
storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      hostname: postgres
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # Serialise complete runs until ingestion and mart rebuilds are concurrency-safe.
    max_concurrent_runs: 1

# No run_launcher block → DefaultRunLauncher (subprocess on the same host).
# QueuedRunCoordinator caps how many run at once via max_concurrent_runs above.
# Runs orphaned by a daemon restart are failed at startup (scripts/entrypoint.sh).

# Backstop for runs that hang while their process is still alive. DefaultRunLauncher
# has no worker health check, so only the timeouts apply. Raise max_runtime_seconds
# if the production nightly ever approaches it.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  max_runtime_seconds: 21600
  poll_interval_seconds: 60

retention:
  schedule:
    purge_after_days: 30
  sensor:
    purge_after_days: 7

telemetry:
  enabled: false
